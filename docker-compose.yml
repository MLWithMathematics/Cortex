version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ai-screening-backend
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=sqlite:///./screening.db
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/screening.db:/app/screening.db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-screening-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
